<!doctype html>
<html lang=en xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>System Settings - PANDAS</title>
    <script src="../static/assets/Global.js" th:src="@{/assets/Global.js}"></script>
    <link rel="stylesheet" href="../static/assets/Global.css" th:href="@{/assets/Global.css}">
</head>
<body>
<nav th:replace="~{_layout.html :: sidebar (activeItem='System Settings')}"></nav>
<main>
    <header>
    </header>
    <h1>Settings</h1>
    <section>
        <h2>Appearance</h2>
        <label for="theme-choice">Theme</label>
        <select id="theme-choice">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="light-warm">Light (warm)</option>
            <option value="dark">Dark</option>
        </select>
    </section>
    <section sec:authorize="hasRole('stduser')">
        <h2>System Settings</h2>
        <h3>General</h3>
        <ul>
            <li sec:authorize="hasRole('stduser')"><a th:href="@{/agencies}">Agencies and Users</a>
            <li sec:authorize="hasRole('stduser')"><a th:href="@{/marcexport}">MARC Export</a>
        </ul>
    </section>
    <section sec:authorize="hasAuthority('PRIV_ADMIN_GATHER_OPTIONS')">
        Gather Settings
        <ul>
            <li sec:authorize="hasAuthority('PRIV_ADMIN_GATHER_OPTIONS')"><a th:href="@{/gather/filterpresets}">Filter Presets</a></li>
            <li sec:authorize="hasAuthority('PRIV_ADMIN_GATHER_OPTIONS')"><a th:href="@{/profiles}">Gather Profiles</a></li>
            <li sec:authorize="hasAuthority('PRIV_ADMIN_GATHER_OPTIONS')"><a th:href="@{/schedules}">Gather Schedules</a></li>
        </ul>
    </section>
</main>
